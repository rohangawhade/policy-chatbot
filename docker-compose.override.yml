# Local development overrides — hot reload and source mounts.
# Applied automatically by `docker compose up` alongside docker-compose.yml.

services:
  backend:
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/src:/app/src
    environment:
      APP_ENV: development

  celery-worker:
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=1 -Q default,embedding,ingestion
    volumes:
      - ./backend/src:/app/src

  frontend:
    build:
      target: build
    command: npm run dev -- --host 0.0.0.0 --port 5173
    env_file:
      - .env
    environment:
      # Forces Vite/chokidar to poll for file changes instead of relying
      # on inotify, which Docker Desktop on Windows doesn't forward across
      # the ./frontend/src bind mount below -- without this, HMR silently
      # stops picking up host-side edits until the container is restarted.
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
