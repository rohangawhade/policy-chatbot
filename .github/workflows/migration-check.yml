name: Migration Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  migration-check:
    name: migration-check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: policypal
          POSTGRES_PASSWORD: policypal
          POSTGRES_DB: policypal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Check for Alembic config
        id: check
        run: |
          if [ -f "backend/alembic.ini" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply migrations to empty database
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://policypal:policypal@localhost:5432/policypal
        run: alembic upgrade head

      - name: Check for model drift
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://policypal:policypal@localhost:5432/policypal
        run: |
          alembic check

      - name: No Alembic setup yet
        if: steps.check.outputs.exists == 'false'
        run: echo "backend/alembic.ini not found yet — skipping (Step 1.3 adds it)."
