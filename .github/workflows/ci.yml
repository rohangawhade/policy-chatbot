name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: backend-quality
    runs-on: ubuntu-latest
    # Step 3.5's repository tests hit a real Postgres (mocking
    # SQLAlchemy's Session/Select internals would be too weak to catch
    # real mapping bugs — see IMPLEMENTATION_STATUS.md's Step 3.5 entry
    # for the ORM/domain enum and timezone bugs this actually caught).
    # Same image/credentials as migration-check.yml's service.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: policypal
          POSTGRES_PASSWORD: policypal
          POSTGRES_DB: policypal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Check if backend exists
        id: check
        run: |
          if [ -f "backend/pyproject.toml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: ruff check .

      - name: ruff format --check
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: ruff format --check .

      - name: mypy --strict
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: mypy --strict src

      - name: Apply migrations (for repository tests)
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://policypal:policypal@localhost:5432/policypal
        run: alembic upgrade head

      - name: pytest with coverage
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://policypal:policypal@localhost:5432/policypal
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=80

      - name: No backend yet
        if: steps.check.outputs.exists == 'false'
        run: echo "backend/pyproject.toml not found yet — skipping (Phase 1 adds it)."

  frontend-quality:
    name: frontend-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if frontend exists
        id: check
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci

      - name: eslint
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint

      - name: tsc --noEmit
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npx tsc --noEmit

      - name: vite build
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build

      - name: No frontend yet
        if: steps.check.outputs.exists == 'false'
        run: echo "frontend/package.json not found yet — skipping (Phase 10 adds it)."
