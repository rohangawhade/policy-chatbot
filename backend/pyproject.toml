[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "policypal-backend"
version = "0.1.0"
description = "PolicyPal — RAG-powered employee benefits chatbot backend"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }

dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.33",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "litellm>=1.63,<1.64",
  # Renamed upstream from `pinecone-client` (<6, no embedding API even at
  # the low level) to `pinecone` (v7+, adds `client.inference.embed()`) --
  # needed for Step 12.2's real embeddings via Pinecone's own inference API
  # (Groq has no embedding endpoint of its own).
  "pinecone>=9.0,<10",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.30,<0.31",
  "alembic>=1.14,<1.15",
  "python-jose[cryptography]>=3.3,<4",
  "passlib[bcrypt]>=1.7,<2",
  # passlib 1.7.4 (unmaintained since 2020) probes bcrypt's internals via
  # `bcrypt.__about__.__version__`, removed in bcrypt 4.0 — every 4.x/5.x
  # bcrypt breaks `AuthService.hash_password`/`verify_password` outright
  # (ValueError from passlib's own internal self-test, not a real 72-byte
  # password). Pinned to the last 3.x line, which passlib 1.7.4 actually
  # supports.
  "bcrypt>=3.2,<4.0",
  "celery[redis]>=5.4,<5.5",
  "redis>=5.2,<6",
  "pymupdf>=1.24,<1.25",
  "python-docx>=1.1,<1.2",
  "openpyxl>=3.1,<3.2",
  "lxml>=5.3,<5.4",
  "structlog>=24.4,<25",
  "tenacity>=9.0,<10",
  "httpx>=0.27,<0.28",
  "python-multipart>=0.0.12,<0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<0.25",
  "pytest-cov>=6.0,<7",
  "ruff>=0.8,<0.9",
  "mypy>=1.14,<1.15",
  "pre-commit>=4.0,<5",
  "pip-audit>=2.7,<3",
  "faker>=33.1,<34",
]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["main", "config"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# FastAPI's DI system requires `Depends(...)` (and friends) as an argument
# default — the one deliberate exception to B008 ("no function calls in
# argument defaults"), not a case B008 is meant to catch. Ruff's own
# documented mechanism for this exact situation.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Header",
  "fastapi.Body",
  "fastapi.Security",
  "fastapi.File",
  "fastapi.Form",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unused_ignores = true

# Celery, the Pinecone client, PyMuPDF (fitz), openpyxl, lxml, python-jose,
# and passlib ship no py.typed marker and no reliable upstream stubs.
[[tool.mypy.overrides]]
module = ["celery.*", "pinecone.*", "fitz.*", "openpyxl.*", "lxml.*", "jose.*", "passlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "error::DeprecationWarning",
  "error::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
